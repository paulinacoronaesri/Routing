<html>
<head>
  <meta charset="utf-8" />
  <title>Prueba Rutas Pau</title>
  <link rel="stylesheet" href="https://js.arcgis.com/4.32/esri/themes/light/main.css" />
  <script src="https://js.arcgis.com/4.32/"></script>
  <style>
    html, body, #viewDiv {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
    }
  </style>
</head>
<body>
  <div id="viewDiv"></div>
  <script>
    require([
      "esri/config",
      "esri/Map",
      "esri/views/MapView",
      "esri/layers/RouteLayer",
      "esri/layers/FeatureLayer",
      "esri/widgets/Directions",
      "esri/widgets/Expand"
    ], function(esriConfig, Map, MapView, RouteLayer, FeatureLayer, Directions, Expand) {

      esriConfig.apiKey = "AAPKa706d18d6c6544cdaa4f7c96dd309c72iyX0J4PvCp3K13GZeHhOl-acWns6EFhfoOr2HY0ghLdtd3osENUGrckZjhcwztAf";

      const routeLayer = new RouteLayer({
        url: "https://spgis.sigsa.info/server/rest/services/Version/Rutas/NAServer/Route"
      });

      const rutapau = new FeatureLayer({
        url: "https://spgis.sigsa.info/server/rest/services/Map4/MapServer/6",
        title: "RedNA",
        opacity: 0.2
      });

      const map = new Map({
        basemap: "arcgis/outdoor",
        layers: [routeLayer, rutapau]
      });

      const view = new MapView({
        container: "viewDiv",
        map: map,
        center: [-99.1332, 19.4326], // CDMX
        zoom: 12
      });

      const directions = new Directions({
        view: view,
        layer: routeLayer
      });

      const expand = new Expand({
        view: view,
        content: directions,
        expanded: true
      });

      view.ui.add(expand, "top-right");
    });
  </script>
</body>
</html>
