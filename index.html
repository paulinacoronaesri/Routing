<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Demo Rutas SIGSA - Pro</title>

  <link rel="stylesheet" href="https://js.arcgis.com/4.32/esri/themes/light/main.css" />
  <script src="https://js.arcgis.com/4.32/"></script>

  <style>
    html, body, #viewDiv {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
    }

    .esri-view .esri-directions {
      max-height: calc(100vh - 90px) !important;
    }
  </style>
</head>

<body>
  <div id="viewDiv"></div>

  <script>
    require([
      "esri/config",
      "esri/Map",
      "esri/views/MapView",
      "esri/layers/RouteLayer",
      "esri/layers/FeatureLayer",
      "esri/widgets/Directions",
      "esri/widgets/Expand",
      "esri/widgets/Locate",
      "esri/widgets/LayerList"
    ], function(esriConfig, Map, MapView, RouteLayer, FeatureLayer, Directions, Expand, Locate, LayerList) {

      esriConfig.apiKey = 
          "a59B_Mtgbik8EDr1NpzP1FQ..1OJKleqYcgXc7GkHEdpInSMf1Y4rN3RU7eJU6X2SRM0lrXELvKEztX7L0GBNTyWJPM_shL7tUtCoU8HA1SlajAAA-A0uxl_5s7WAtxZwS5ZKdkVlrqXbEIYAUUGZ4nhjPq30e4l-ZZxhXeXQbRTCI62xJCySlnBRcWerr0QhsmeysA3IVH5TuSwinjgPq8uuIg..";

      const routeLayer = new RouteLayer({
        url: "https://spgis.sigsa.info/server/rest/services/Version/Rutas/NAServer/Route",
        title: "Rutas"
      });

      const rutapau = new FeatureLayer({
        url: "https://spgis.sigsa.info/server/rest/services/Map4/MapServer/6",
        title: "RedNA",
        opacity: 0.4
      });

      // Mapa (AHORA sí agregamos routeLayer)
      const map = new Map({
        basemap: "arcgis/navigation",
        layers: [rutapau, routeLayer] // 🔥 routeLayer al final para que se vea encima
      });

      const view = new MapView({
        container: "viewDiv",
        map: map,
        center: [-99.1332, 19.4326],
        zoom: 12
      });

      const directions = new Directions({
        view: view,
        layer: routeLayer,
        searchProperties: {
          sources: [{
            url: "https://geocode-api.arcgis.com/arcgis/rest/services/World/GeocodeServer",
            name: "ArcGIS World Geocoder",
            placeholder: "Buscar dirección o lugar...",
            countryCode: "MX"
          }]
        }
      });

      const expandDirections = new Expand({
        view: view,
        content: directions,
        expanded: true
      });

      view.ui.add(expandDirections, "top-right");

      const locate = new Locate({
        view: view,
        useHeadingEnabled: false,
        goToOverride: function(view, options) {
          options.target.scale = 1500;
          return view.goTo(options.target);
        }
      });

      view.ui.add(locate, "top-left");

      const layerList = new LayerList({
        view: view
      });

      view.ui.add(layerList, "top-right");

    });
  </script>
</body>
</html>
