<html>
<head>
  <meta charset="utf-8" />
  <title>Demo Rutas SIGSA - Pro</title>
  <link rel="stylesheet" href="https://js.arcgis.com/4.32/esri/themes/light/main.css" />
  <script src="https://js.arcgis.com/4.32/"></script>

  <style>
    html, body, #viewDiv {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
    }
    .esri-view .esri-directions {
      max-height: calc(100vh - 90px) !important;
    }
  </style>
</head>

<body>
  <div id="viewDiv"></div>

  <script>
    require([
      "esri/config",
      "esri/Map",
      "esri/views/MapView",
      "esri/layers/FeatureLayer",
      "esri/widgets/Directions",
      "esri/widgets/Expand",
      "esri/widgets/Locate",
      "esri/widgets/LayerList",
      "esri/widgets/BasemapGallery",
      "esri/layers/GraphicsLayer"
    ], function(
      esriConfig,
      Map,
      MapView,
      FeatureLayer,
      Directions,
      Expand,
      Locate,
      LayerList,
      BasemapGallery,
      GraphicsLayer
    ) {

      esriConfig.apiKey = "AAPKa706d18d6c6544cdaa4f7c96dd309c72iyX0J4PvCp3K13GZeHhOl-acWns6EFhfoOr2HY0ghLdtd3osENUGrckZjhcwztAf";

      // Feature Layer
      const rutapau = new FeatureLayer({
        url: "https://spgis.sigsa.info/server/rest/services/Map4/MapServer/6",
        title: "RedNA",
        opacity: 0.2
      });

      // Layer donde Directions dibuja las rutas
      const routeLayer = new GraphicsLayer({
        title: "Rutas"
      });

      // Map
      const map = new Map({
        basemap: "arcgis/outdoor",
        layers: [rutapau, routeLayer]
      });

      // View
      const view = new MapView({
        container: "viewDiv",
        map: map,
        center: [-99.1332, 19.4326],
        zoom: 12
      });

      // Directions
      const directions = new Directions({
        view: view,
        layer: routeLayer
      });

      const expandDirections = new Expand({
        view: view,
        content: directions,
        expanded: true
      });

      view.ui.add(expandDirections, "top-right");

      // Locate
      const locate = new Locate({
        view: view,
        useHeadingEnabled: false,
        goToOverride: function(view, options) {
          options.target.scale = 1500;
          return view.goTo(options.target);
        }
      });

      view.ui.add(locate, "top-left");

      // LayerList
      const layerList = new LayerList({
        view: view,
        listItemCreatedFunction: function(event) {
          const item = event.item;
          item.panel = {
            content: "legend",
            open: false
          };
        }
      });

      view.ui.add(layerList, "top-right");

      // Basemap Gallery
      const basemapGallery = new BasemapGallery({
        view: view
      });

      const expandBasemap = new Expand({
        view: view,
        content: basemapGallery,
        expanded: false
      });

      view.ui.add(expandBasemap, "top-left");

    });
  </script>
</body>
</html>
